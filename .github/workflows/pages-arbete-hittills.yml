# Publishes only the sanitized function catalog to GitHub Pages.
# Does not change repository visibility. Site path after deploy:
#   https://artificer-vault-hivemindsysop.github.io/dirigentverket/arbete-hittills/
name: pages-arbete-hittills

on:
  push:
    branches: [main]
    paths:
      - "public/arbete-hittills/**"
      - ".github/workflows/pages-arbete-hittills.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage only arbete-hittills
        run: |
          mkdir -p _site/arbete-hittills
          cp -a public/arbete-hittills/. _site/arbete-hittills/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
