<line x1="610" y1="800" x2="330" y2="800" stroke="#f6dc8e" stroke-width="3"/>
<rect x="5" y="680" width="470" height="240" rx="14" fill="#141922" stroke="#d9b24c" stroke-width="2.5"/>
<text x="240" y="752" text-anchor="middle" font-family="DejaVu Serif" font-size="46" letter-spacing="6" fill="#d9b24c">ÄRA</text>
<text x="240" y="798" text-anchor="middle" font-family="DejaVu Serif" font-style="italic" font-size="28" fill="#efe6cf">Ansvaret</text>
<text x="240" y="838" text-anchor="middle" font-family="DejaVu Sans" font-size="20" fill="#c9c1ad">förpliktelsen till sanningen, att lyfta</text>
<text x="240" y="866" text-anchor="middle" font-family="DejaVu Sans" font-size="20" fill="#c9c1ad">varandra i stället för att fälla varandra</text>
