<line x1="800" y1="990" x2="800" y2="1270" stroke="#f6dc8e" stroke-width="3"/>
<rect x="565" y="1240" width="470" height="240" rx="14" fill="#141922" stroke="#d9b24c" stroke-width="2.5"/>
<text x="800" y="1312" text-anchor="middle" font-family="DejaVu Serif" font-size="46" letter-spacing="6" fill="#d9b24c">JORD</text>
<text x="800" y="1358" text-anchor="middle" font-family="DejaVu Serif" font-style="italic" font-size="28" fill="#efe6cf">Mater</text>
<text x="800" y="1398" text-anchor="middle" font-family="DejaVu Sans" font-size="20" fill="#c9c1ad">fertilitet, sällsynta jordartsmetaller,</text>
<text x="800" y="1426" text-anchor="middle" font-family="DejaVu Sans" font-size="20" fill="#c9c1ad">bergen, jorden, det allting byggs ifrån</text>
