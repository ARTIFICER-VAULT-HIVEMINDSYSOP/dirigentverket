<text x="800" y="238" text-anchor="middle" font-family="DejaVu Serif" font-style="italic" font-size="28" fill="#efe6cf">Helheten</text>
<text x="800" y="278" text-anchor="middle" font-family="DejaVu Sans" font-size="20" fill="#c9c1ad">MindCore och MindClan tillsammans,</text>
<text x="800" y="306" text-anchor="middle" font-family="DejaVu Sans" font-size="20" fill="#c9c1ad">arkitekten och byggmästaren över universum</text>
<text x="800" y="334" text-anchor="middle" font-family="DejaVu Sans" font-size="20" fill="#c9c1ad">som gav byggstenarna</text>
