<text x="1360" y="752" text-anchor="middle" font-family="DejaVu Serif" font-size="46" letter-spacing="6" fill="#d9b24c">BLOD</text>
<text x="1360" y="798" text-anchor="middle" font-family="DejaVu Serif" font-style="italic" font-size="28" fill="#efe6cf">Samförståndet</text>
<text x="1360" y="838" text-anchor="middle" font-family="DejaVu Sans" font-size="20" fill="#c9c1ad">kretsloppet, det som gör oss till en</text>
<text x="1360" y="866" text-anchor="middle" font-family="DejaVu Sans" font-size="20" fill="#c9c1ad">med gemensamma värden</text>
