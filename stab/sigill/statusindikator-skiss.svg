  <circle cx="480" cy="500" r="16" fill="#141922"/>
  <text x="480" y="506" text-anchor="middle" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#f6dc8e">#6</text>

  <rect x="56" y="900" width="848" height="300" rx="12" fill="#141922" stroke="#8a7a4a" stroke-width="1.5"/>
  <text x="80" y="932" font-family="DejaVu Serif" font-size="16" fill="#f3d27a">FÖRSLAG – ÖB bekräftar · kuben är femte delen</text>
  <ellipse cx="104" cy="968" rx="30" ry="16" fill="none" stroke="#f6dc8e" stroke-width="8"/>
  <text x="152" y="974" font-family="DejaVu Sans" font-size="15" fill="#efe6cf">tänd ögla = omväg i pelaren (VANTAR eller PROVAD)</text>
  <circle cx="104" cy="1004" r="12" fill="#f3d27a"/>
  <text x="104" y="1009" text-anchor="middle" font-family="DejaVu Sans" font-size="13" font-weight="700" fill="#1a1408">1</text>
  <text x="152" y="1010" font-family="DejaVu Sans" font-size="15" fill="#efe6cf">badge = antal VANTAR. Siffran är sim, inte ett repo-mått.</text>
  <ellipse cx="104" cy="1040" rx="30" ry="16" fill="none" stroke="#d9b24c" stroke-width="2.5"/>
  <text x="152" y="1046" font-family="DejaVu Sans" font-size="15" fill="#efe6cf">guld-söm = ATERINTRADD i pelaren. Jord visas så.</text>
  <text x="152" y="1082" font-family="DejaVu Sans" font-size="15" fill="#efe6cf">tänd kub = PROVAD. Äldre omvägsrad prövas först. Numret är loopen.</text>
  <text x="152" y="1118" font-family="DejaVu Sans" font-size="15" fill="#efe6cf">guld-kant = ATERINTRADD. Skissen visar loop #6.</text>
  <text x="152" y="1154" font-family="DejaVu Sans" font-size="15" fill="#efe6cf">Dubbel trådkub, alla kanter synliga. Betraktaren sitter i mitten.</text>
</svg>
