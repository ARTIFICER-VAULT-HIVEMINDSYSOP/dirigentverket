<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1240" viewBox="0 0 960 1240">
  <title>Statusindikator, utkast. Kub i mitten, loop #6, guld-kant.</title>
  <desc>Sankt Hans vapen som status. Tecknet är U+2318. Fyra öglor: Gud upptill, Blod till höger, Jord nedtill, Ära till vänster. I mitten två nästlade isometriska trådkuber, alla kanter synliga. Skissen visar läget efter tabell-simets loop #6: Jord har guld-söm, kuben har guld-kant och bär numret #6. Förslag tills ÖB bekräftar. Ingen sol, inget hjul, inga strålar.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#1b212b"/>
      <stop offset="1" stop-color="#0e1116"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect width="960" height="1240" fill="url(#bg)"/>

  <text x="480" y="42" text-anchor="middle" font-family="DejaVu Serif" font-size="28" letter-spacing="4" fill="#e6c56a">STATUSINDIKATOR</text>
  <text x="480" y="68" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="#c9c1ad">Utkast · fyra öglor och dubbel kub i mitten av &#8984;</text>
  <text x="480" y="90" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#f3d27a">FÖRSLAG – ÖB bekräftar</text>

  <text x="480" y="124" text-anchor="middle" font-family="DejaVu Serif" font-size="24" letter-spacing="3" fill="#9a917f">GUD</text>
  <text x="480" y="144" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#6d6454">Helheten · släckt</text>
  <ellipse cx="480" cy="206" rx="84" ry="44" fill="none" stroke="#6d6454" stroke-width="11"/>
  <line x1="480" y1="252" x2="480" y2="360" stroke="#6d6454" stroke-width="3"/>

  <text x="150" y="392" text-anchor="middle" font-family="DejaVu Serif" font-size="24" letter-spacing="3" fill="#9a917f">ÄRA</text>
  <text x="150" y="414" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#6d6454">Sanningen · släckt</text>
  <ellipse cx="150" cy="500" rx="46" ry="72" fill="none" stroke="#6d6454" stroke-width="11"/>
  <line x1="198" y1="500" x2="360" y2="500" stroke="#6d6454" stroke-width="3"/>

  <text x="810" y="392" text-anchor="middle" font-family="DejaVu Serif" font-size="24" letter-spacing="3" fill="#9a917f">BLOD</text>
  <text x="810" y="414" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#6d6454">Kretsloppet · släckt</text>
  <ellipse cx="810" cy="500" rx="46" ry="72" fill="none" stroke="#6d6454" stroke-width="11"/>
  <line x1="600" y1="500" x2="762" y2="500" stroke="#6d6454" stroke-width="3"/>

  <line x1="480" y1="640" x2="480" y2="708" stroke="#d9b24c" stroke-width="2"/>
  <ellipse cx="480" cy="758" rx="84" ry="44" fill="none" stroke="#d9b24c" stroke-width="2.5"/>
  <text x="480" y="836" text-anchor="middle" font-family="DejaVu Serif" font-size="24" letter-spacing="3" fill="#d9b24c">JORD</text>
  <text x="480" y="858" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#efe6cf">Marken · guld-söm · exempel</text>

  <circle cx="480" cy="500" r="108" fill="#141922" stroke="#8a7a4a" stroke-width="2"/>
  <text x="480" y="548" text-anchor="middle" font-family="DejaVu Sans" font-size="120" fill="#d9b24c" opacity="0.28">&#8984;</text>
